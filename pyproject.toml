[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "german-gdp-nowcasting"
version = "0.1.0"
description = "Real-time indicator selection and mixed-frequency nowcasting of German GDP"
readme = "README.md"
requires-python = ">=3.13,<3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy==2.1.3",
    "pandas==2.3.3",
    "scipy==1.15.3",
    "scikit-learn==1.8.0",
    "statsmodels==0.14.6",
    "xgboost==3.2.0",
    "shap==0.51.0",
    "joblib==1.5.3",
    "openpyxl==3.1.5",
    "pyarrow==24.0.0",
    "tqdm==4.67.3",
]

[project.optional-dependencies]
visualization = [
    "matplotlib==3.10.8",
    "plotly==6.7.0",
    "cycler==0.12.1",
]
bayesian = [
    "jax==0.10.0",
    "jaxlib==0.10.0",
    "numpyro==0.21.0",
]
notebooks = [
    "seaborn==0.13.2",
    "jupyter==1.1.1",
    "ipykernel==7.2.0",
    "ipython==9.12.0",
    "nbformat==5.10.4",
]
full = [
    "matplotlib==3.10.8",
    "plotly==6.7.0",
    "cycler==0.12.1",
    "jax==0.10.0",
    "jaxlib==0.10.0",
    "numpyro==0.21.0",
    "seaborn==0.13.2",
    "jupyter==1.1.1",
    "ipykernel==7.2.0",
    "ipython==9.12.0",
    "nbformat==5.10.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
include = ["src", "scripts", "tests"]
pythonVersion = "3.13"
